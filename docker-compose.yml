services:
  postgres:
    # Custom image (docker/postgres.Dockerfile): postgis/postgis:16-3.4
    # + the pgvector extension package layered on top, so one container
    # serves both Phase 3's RAG doubt solver (pgvector, material_chunks)
    # and Phase 4's marketplace geo search (PostGIS, tutor_locations).
    # The named volume below is untouched by the image change, so
    # existing data survives the swap.
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: tuition_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition_dev_password
      POSTGRES_DB: tuition_dev
    ports:
      - "5432:5432"
    volumes:
      - tuition_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tuition_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tuition_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuition_pg_data:
  tuition_redis_data:
