services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension
    # binaries, needed for Phase 3's RAG doubt solver (material_chunks).
    # Same base image otherwise; the named volume below is untouched by
    # the image change, so existing data survives the swap.
    image: pgvector/pgvector:pg16
    container_name: tuition_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition_dev_password
      POSTGRES_DB: tuition_dev
    ports:
      - "5432:5432"
    volumes:
      - tuition_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d tuition_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tuition_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tuition_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuition_pg_data:
  tuition_redis_data:
