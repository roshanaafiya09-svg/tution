# Render Blueprint for the NestJS backend. Deploy: Render dashboard →
# "New +" → "Blueprint" → connect this repo → Render finds this file.
#
# DB/Redis are NOT Render-managed here (Render's own Postgres/Redis
# require a paid plan) — point DATABASE_URL/REDIS_URL at Neon/Upstash
# instead (see handover.md for the full walkthrough). Every var below
# marked `sync: false` is a secret you paste into the Render dashboard
# after the first deploy; nothing sensitive lives in this file.
services:
  - type: web
    name: tuition-app-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # PORT is deliberately not set here — Render injects its own (10000)
      # and health-checks that port. Overriding it makes the app bind
      # somewhere Render never probes, so the deploy times out.
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email, via Brevo's HTTPS API, is the ONLY OTP delivery channel —
      # both required together, with no fallback of any kind in
      # production. The backend refuses to start if either is missing
      # once NODE_ENV=production (set above) — it will NOT silently log
      # codes instead of emailing them. BREVO_API_KEY is the Brevo
      # transactional API key; SMTP_USER is reused as the Brevo sender
      # identity (must match a sender verified in the Brevo dashboard),
      # not used for actual SMTP. See handover.md §6.7. Paste real
      # values into Render's dashboard after the first deploy — never
      # here.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
