# Render Blueprint for the NestJS backend. Deploy: Render dashboard →
# "New +" → "Blueprint" → connect this repo → Render finds this file.
#
# DB/Redis are NOT Render-managed here (Render's own Postgres/Redis
# require a paid plan) — point DATABASE_URL/REDIS_URL at Neon/Upstash
# instead (see handover.md for the full walkthrough). Every var below
# marked `sync: false` is a secret you paste into the Render dashboard
# after the first deploy; nothing sensitive lives in this file.
services:
  - type: web
    name: tuition-app-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # PORT is deliberately not set here — Render injects its own (10000)
      # and health-checks that port. Overriding it makes the app bind
      # somewhere Render never probes, so the deploy times out.
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Telegram is the only OTP delivery channel. Both are required
      # together — unset falls back to console-logged codes, which is a
      # dev-only mode and must not be relied on in production.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
